name: Build and Deploy

on:
  push:
    branches: [ main ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/ec2session

jobs:
  # ─── Job 1: 빌드 및 Docker 이미지 Push ───────────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle (skip tests)
        run: ./gradlew build -x test --no-daemon

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ─── Job 2: EC2 배포 ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 최신 이미지 Pull
            docker pull ${{ env.IMAGE_NAME }}:latest

            # 기존 컨테이너 중지 및 삭제
            docker stop ec2session || true
            docker rm ec2session || true

            # 새 컨테이너 실행
            docker run -d \
              --name ec2session \
              --restart unless-stopped \
              -p 8080:8080 \
              -e DATABASE_HOST=${{ secrets.DATABASE_HOST }} \
              -e DATABASE_PORT=${{ secrets.DATABASE_PORT }} \
              -e DATABASE_NAME=${{ secrets.DATABASE_NAME }} \
              -e DATABASE_USER=${{ secrets.DATABASE_USER }} \
              -e DATABASE_PASS=${{ secrets.DATABASE_PASS }} \
              -e JWT_KEY=${{ secrets.JWT_KEY }} \
              -e JWT_ISSUER=${{ secrets.JWT_ISSUER }} \
              -e JWT_AT_EXPIRATION=${{ secrets.JWT_AT_EXPIRATION }} \
              -e JWT_RT_EXPIRATION=${{ secrets.JWT_RT_EXPIRATION }} \
              ${{ env.IMAGE_NAME }}:latest

            # 사용하지 않는 이미지 정리
            docker image prune -f
